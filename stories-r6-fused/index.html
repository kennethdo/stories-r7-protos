 '<div class="meta" style="margin-top:4px">'+T('揭曉咗 '+revN()+' 個，中 '+hits()+' 個 · 其餘 3 Nov 揭曉','Revealed '+revN()+', right '+hits()+' · rest on 3 Nov')+'</div>'+
 '<details class="info"><summary>ⓘ '+T('分數分佈','Score spread')+'</summary><div class="curve">'+svg+'<div class="meta" style="display:flex;justify-content:space-between"><span>'+T('分低','Low')+'</span>'+(n?'<span style="color:var(--ink)">'+T('你','You')+'</span>':'')+'<span>'+T('分高','High')+'</span></div></div></details>'+
 (S.rev?'<div class="cut'+(inCut?' in':'')+'"><div class="sec" style="margin-top:0"><span>'+T('入唔入季榜','Season board?')+'</span></div><div class="picked" style="font-size:22px">'+(inCut?T('入咗季榜','You made the season board'):T('未入季榜','Not on the season board'))+'</div><div class="meta" style="margin-top:4px">'+T('季榜線：第 '+fmt(CUT)+' 名','Cut line: #'+fmt(CUT))+'</div></div>':'')+
 '<div class="meta" style="margin-top:18px">'+T('同分：早出 call 嘅排前','Ties: the earlier call ranks higher')+'</div>'+regCard()+
 '<div class="dock"><div class="in">'+P(T('讀今日報道',"Read today's article"),'E.open('+S.today+')','newspaper')+'</div></div>'}
function bars(){let h='';for(let j=0;j<opened();j++)h+='<i class="'+(j<=S.i?'on':'')+'"></i>';return '<div class="bars">'+h+'</div>'}
V.deck=()=>{const s=S.i,x=S.b[s];if(!S._e2){track('E2','開文章頁','Article slide opened');S._e2=1}
 const late=s<S.today&&!revealed(s)&&!x.pick;
 let body='<div class="bign">0'+(s+1)+'</div><div class="kick">Forbes · '+x.d+(s===S.today?' · '+T('今日','Today'):'')+'</div><div class="hl1">'+tx(x.hl)+'</div><div class="dek">'+tx(x.dek)+'</div>'+
  (x.read?'<div class="rd"><span class="chip">'+ic('check','sm')+T('讀咗','Read')+'</span></div>':'');
 if(x.rel!=null){const t=S.b[x.rel];
  if(t.pick&&!revealed(x.rel)){if(t.changed&&S.chg.some(c=>c.cell===x.rel&&c.by===s))body+='<div class="evb"><div class="t">'+ic('lock','sm')+' '+T('第 '+(x.rel+1)+' 格改咗做 '+PK(t.pick)+'，揭曉前鎖','Cell '+(x.rel+1)+' is now '+PK(t.pick)+'. Locked till reveal')+'</div></div>';
   else if(t.changed)body+='<div class="evb"><div class="t">'+T('第 '+(x.rel+1)+' 格已經改過，鎖咗','Cell '+(x.rel+1)+' was changed. Locked')+'</div></div>';
   else if(S.evDone&&S.evDone[s])body+='<div class="evb"><div class="t">'+T('你保持第 '+(x.rel+1)+' 格：'+PK(t.pick),'You kept cell '+(x.rel+1)+': '+PK(t.pick))+'</div></div>';
   else if(x.read){const o=t.pick==='y'?'n':'y';body+='<div class="evb"><div class="t">'+T('新證據：第 '+(x.rel+1)+' 格你揀咗 '+PK(t.pick)+'。改唔改？','New evidence: cell '+(x.rel+1)+' is '+PK(t.pick)+'. Change it?')+'</div><div class="meta">'+T('改唔扣分，揭曉前鎖','No penalty. Locks before reveal')+'</div><div class="row">'+Sb(T('保持 ','Keep ')+PK(t.pick),"E.ev("+s+",'keep')")+Sb(T('改做 ','Change to ')+PK(o),"E.ev("+s+",'chg')")+'</div></div>'}
   else body+='<div class="evb"><div class="meta" style="color:var(--body)">'+T('新證據：睇完全文先可以改第 '+(x.rel+1)+' 格','New evidence: read it to change cell '+(x.rel+1))+'</div></div>'}}
 body+='<div class="q"><div class="qq">'+tx(x.q)+'</div>';
 if(revealed(s))body+='<div class="picked rv">'+T('揭曉：','Result: ')+PK(x.res)+'</div><div class="prev'+(x.pick?(x.pick===x.res?' hit':' miss'):'')+'">'+(x.pick?(x.pick===x.res?T('你揀 '+PK(x.pick)+'，中咗','You said '+PK(x.pick)+'. Right'):T('你揀 '+PK(x.pick)+'，唔中','You said '+PK(x.pick)+'. Wrong')):T('你冇填呢格','You missed this one'))+'</div></div>';
 else if(!x.pick)body+=(late?'<div class="late">'+T('遲咗出 call，分少啲','A late call scores less')+'</div>':'')+'<div class="yn">'+Sb(T('會','Yes'),"E.call("+s+",'y')")+Sb(T('唔會','No'),"E.call("+s+",'n')")+'</div></div>';
 else body+='<div class="picked">'+T('你揀咗：','You said: ')+PK(x.pick)+'</div><div class="late">'+T('提早 '+held(s)+' 日出 call · 越早分越多（最多 '+full(s)+' 日）','Called '+held(s)+' days early · earlier scores more (max '+full(s)+')')+'</div>'+rankLine()+regCard()+'</div><div class="hook">'+ic('newspaper','sm')+'<span>'+tx(x.hook)+'</span></div>';
 const nx=s<S.today?Lk(T('下一篇','Next article'),'E.next()','chevron-right'):Lk(T('返 Story','Back to Story'),"E.go('story')",'chevron-right');
 return '<div class="deck"><div class="frame">'+bars()+'<div class="top"><button onclick="E.go(\'story\')" aria-label="close">'+ic('x')+'</button><div class="t">'+T('第 '+(s+1)+' / 5 篇','Article '+(s+1)+' of 5')+' · '+EX()+'</div>'+demoChip()+lang()+'</div><div class="slide" id="sl">'+body+'</div>'+demoHTML()+'<div class="dk">'+P(x.read?T('再睇全文','Read it again'):T('睇全文','Read full story'),'E.read('+s+')','newspaper')+'<div class="sub">'+nx+'</div></div></div></div>'};
V.arrive=()=>{const s=S.arrive,x=S.b[s];
 return '<div class="deck"><div class="frame"><div class="top"><button onclick="E.go(\'story\')" aria-label="close">'+ic('x')+'</button><div class="t">'+T('由第 '+(s+1)+' 篇入','From article '+(s+1))+' · '+EX()+'</div>'+demoChip()+lang()+'</div>'+demoHTML()+
 '<div class="slide"><div class="kick">Forbes · '+x.d+'</div><div class="hl1">'+tx(x.hl)+'</div><div class="q"><div class="qq">'+tx(x.q)+'</div><div class="picked rv">'+T('已揭曉：','Revealed: ')+PK(x.res)+'</div><div class="prev">'+(x.pick?T('你揀咗 '+PK(x.pick),'You said '+PK(x.pick)):T('呢格已經揭曉，唔可以再填','This cell is revealed. It is closed'))+'</div></div></div>'+
 '<div class="dk">'+P(T('讀今日報道',"Read today's article"),'E.open('+S.today+')','newspaper')+'</div></div></div>'};
V.forbes=()=>{const x=S.b[S.fx];
 return '<div class="top"><button onclick="E.back()" aria-label="back">'+ic('arrow-left')+'</button><div class="t">forbes.com · '+EX()+'</div>'+demoChip()+lang()+'</div>'+demoHTML()+
 '<div class="fb"><div class="mast">Forbes</div><div class="kick" style="margin-top:20px">'+T('政治','Politics')+' · '+x.d+'</div><div class="hl1">'+tx(x.hl)+'</div><div class="dek">'+tx(x.dek)+'</div><div style="margin-top:14px"><a class="lnk fbx" href="https://www.forbes.com/?utm_source=axiom&amp;utm_medium=midterm-tracker&amp;utm_campaign=forbes-article" target="_blank" rel="noopener">'+T('喺 Forbes.com 打開 ↗','Open on Forbes.com ↗')+'</a></div><div class="meta" style="margin-top:18px">'+T('全文喺 Forbes.com','Full story on Forbes.com')+'</div><div style="margin-top:12px">'+'<div class="ln"></div>'.repeat(3)+'<div class="ln" style="width:70%"></div><br>'+'<div class="ln"></div>'.repeat(4)+'<div class="ln" style="width:55%"></div></div></div>'+
 '<div class="dock"><div class="in"><div class="meta" style="margin-bottom:10px;text-align:center">'+(revealed(S.fx)?T('呢格已揭曉','This cell is revealed'):x.pick?T('你揀咗：'+PK(x.pick)+'，返去睇','You said: '+PK(x.pick)+'. Go back to see'):T('呢篇有個 call，讀完返去出','This article has a call. Read, then call'))+'</div>'+P(x.pick||revealed(S.fx)?T('返去睇','Go back'):T('返去出 call','Back to make the call'),'E.back()','arrow-left')+'</div></div>'};
function R(){document.getElementById('app').innerHTML=V[S.view]()+(S.toast?'<div class="toast">'+S.toast+'</div>':'');document.querySelectorAll('#app a[href]').forEach(a=>{const h=a.getAttribute('href');if(h&&!/^(#|mailto:|javascript:)/.test(h)&&(/stories-r/i.test(h)||!/^https?:/i.test(h)))a.setAttribute('href',withTheme(h))});document.documentElement.lang=L==='zh'?'zh-HK':'en'}
let tt;function toast(m){S.toast=m;clearTimeout(tt);tt=setTimeout(()=>{S.toast='';R()},1600)}
const E={
 go(v){S.view=v;R();scrollTo(0,0)},
 tab(t){S.tab=t;S.view='story';R();scrollTo(0,0)},
 open(i){if(i>S.today)return;S.i=i;S.view='deck';R();scrollTo(0,0)},
 next(){if(S.i<S.today){S.i++;R()}else E.go('story')},
 call(i,p){const x=S.b[i];if(x.pick||revealed(i)||i>S.today)return;x.pick=p;x.cd=S.today;track('E4','出 call '+(i+1)+'：'+PK(p),'Call '+(i+1)+': '+PK(p));R()},
 ev(s,k){const t=S.b[S.b[s].rel];if(!S.b[s].read||t.changed||revealed(S.b[s].rel))return;
  if(k==='chg'){const f=t.pick;t.pick=f==='y'?'n':'y';t.changed=true;S.chg.push({cell:S.b[s].rel,by:s,from:f,to:t.pick});track('U1','新證據：改第 '+(S.b[s].rel+1)+' 格','Evidence: changed cell '+(S.b[s].rel+1))}
  else{S.evDone=S.evDone||{};S.evDone[s]=1;track('U0','新證據：保持','Evidence: kept')}R()},
 read(i){S.fx=i;track('F1','撳睇全文 '+(i+1),'Tapped read full story '+(i+1));S.view='forbes';R();scrollTo(0,0)},
 back(){const i=S.fx;S.b[i].read=true;S.i=i;track('E3','由文章返嚟 '+(i+1),'Back from article '+(i+1));S.view='deck';R()},
 regOpen(){S.regForm=true;track('E5b','撳註冊保存','Tapped sign up');R()},
 regDo(){S.guest=false;track('E6r','註冊完成','Signed up');toast(T('已保存','Saved'));R()},
 regLater(){S.regLater=true;R()},
 lang(l){L=l;syncURL();R()},
 theme(t){TH=t==='light'?'light':'dark';applyTheme();syncURL();R()},
 dp(){S.dpo=!S.dpo;R()},
 arrive(n){const i=n-1;if(i<0||i>S.today)return;track('E0','由第 '+n+' 篇入','Arrived from article '+n);if(revealed(i)){S.arrive=i;S.view='arrive'}else{S.i=i;S.view='deck'}R()},
 d(k){if(k==='rs'){const dm=S.demo;reset();S.demo=dm;S.dpo=true}
  if(k==='tm'&&S.today<4){S.today++;S.i=S.today;track('D1','跳到聽日','Jumped a day')}
  if(k==='f1')return E.arrive(1);if(k==='f2')return E.arrive(2);
  if(k==='rv')S.rev=!S.rev;if(k==='in')S.guest=false;R()}};
R();
const fm=Q.match(/from=(\d)/);if(fm)E.arrive(+fm[1]);
</script></body></html>
