<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stories R7 · 今日結果→聽日支線</title><style>:root{--bg:#000;--ink:#ededed;--body:#a1a1a1;--mute:#8f8f8f;--dim:#6a6a6a;--hair:#262626;--hs:#3d3d3d;--surface:#0a0a0a;--surface-2:#1a1a1a;--btn:#ededed;--btn-ink:#000;--overlay:rgba(0,0,0,.7);--split-track:#262626;--title:Graphik,'Helvetica Neue',Arial,sans-serif;--detail:Inter,system-ui,-apple-system,'PingFang HK','Noto Sans CJK TC',sans-serif}
[data-theme=light]{--bg:#fff;--ink:#111;--body:#4d4d4d;--mute:#6f6f6f;--dim:#8a8a8a;--hair:#e6e6e6;--hs:#d4d4d4;--surface:#fafafa;--surface-2:#f0f0f0;--btn:#111;--btn-ink:#fff;--overlay:rgba(0,0,0,.35);--split-track:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--detail);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit}
.app{max-width:390px;margin:0 auto;min-height:100vh;position:relative;padding:0 20px 180px;overflow-x:hidden}
.top{display:flex;align-items:center;gap:10px;height:56px}
.top .t{flex:1;font-size:13px;color:var(--mute)}
.sw{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}.sw b{color:var(--ink);font-weight:600}.sw button{position:relative;min-width:22px}.sw button::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.ex{font-size:13px;color:var(--dim)}
.kick{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:18px}
.h1{font-family:var(--title);font-weight:600;letter-spacing:-.035em;font-size:31px;line-height:1.1;margin-top:10px}
.meta{font-size:13px;color:var(--mute)}
.body{color:var(--body)}
.btn-p{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:9px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;text-decoration:none}
.btn-s{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:9px;border:1px solid var(--hs);font-size:16px;font-weight:600;color:var(--ink)}
.btn-s.sm{min-height:44px;height:44px;padding:0 14px;font-size:14px;font-weight:500}
.lnk{color:var(--body);font-size:14px;text-decoration:underline;text-underline-offset:3px;display:inline-flex;gap:6px;align-items:center;position:relative}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--hair);z-index:5}
.dock .in{max-width:390px;margin:0 auto;padding:10px 20px 22px}.dock .cap{font-size:13px;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.q{margin-top:26px;border-top:1px solid var(--hair);padding-top:16px}
.q .lab{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.q .qq{font-family:var(--title);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:6px}
.yn{display:flex;gap:10px;margin-top:14px}.yn>*{flex:1}
.you{display:flex;gap:8px;align-items:baseline;margin-top:12px;font-size:15px}.you b{font-family:var(--title);font-size:26px;letter-spacing:-.03em}
.crowd{margin-top:14px}.split{height:8px;border-radius:4px;background:var(--split-track);overflow:hidden}.split i{display:block;height:100%;background:var(--body);transition:width .6s}
.crowd .row{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--mute)}
.demo{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 0;border-top:1px dashed var(--hs);border-bottom:1px dashed var(--hs)}.demo .meta{flex:1}
.reg{margin-top:22px;margin-bottom:12px;border-left:2px solid var(--ink);padding:2px 0 2px 14px;position:relative;z-index:2}.reg .t{font-size:16px;font-weight:600}.reg .meta{margin-top:4px}
.reg .row{display:flex;gap:16px;align-items:center;margin-top:12px}
.field{min-height:44px;height:44px;border:1px solid var(--hs);border-radius:9px;display:flex;align-items:center;padding:0 12px;color:var(--dim);flex:1;font-size:14px}
.score{display:flex;gap:28px;margin-top:18px;padding-top:14px;border-top:1px solid var(--hair)}.score b{display:block;font-family:var(--title);font-size:28px;letter-spacing:-.03em}.score span{font-size:13px;color:var(--mute)}
.res{font-family:var(--title);font-size:24px;font-weight:600;margin-top:16px;border-left:2px solid var(--ink);padding-left:12px;letter-spacing:-.02em}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--hs);border-radius:9px;padding:8px 14px;font-size:13px;z-index:10;white-space:nowrap}
.foot{margin-top:28px;font-size:13px;color:var(--dim)}
.fork{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:13px;color:var(--mute)}
.fork .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:13px}
.fork .ln{flex:1;border-top:1px dashed var(--hs)}.fork .n.f{border:1px dashed var(--hs);color:var(--dim);font-weight:400}
.card3{perspective:1100px;margin-top:14px}
.card3 .inner{display:grid;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.card3.fl .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;border:1px solid var(--hs);border-radius:12px;padding:18px 16px;background:var(--bg);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;min-height:300px;position:relative}
.face.bk{transform:rotateY(180deg);border:2px solid var(--ink)}
.face .cd{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.face .qq{font-family:var(--title);font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:8px}
.face .hint{margin-top:auto;padding-top:14px;font-size:13px;color:var(--dim);display:flex;gap:8px;align-items:center}
.face .hint:before{content:"";width:22px;height:14px;border:1px dashed var(--hs);border-radius:3px}
.face .corner{position:absolute;right:14px;bottom:12px;font:700 13px var(--detail);color:var(--dim);letter-spacing:.08em}
.br{margin-top:12px;padding:12px 0 12px 14px;border-left:2px dashed var(--hs);color:var(--dim)}
.br .if{font-size:13px}.br .tq{font-size:16px;line-height:1.35;margin-top:4px}.br .fa{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.br.on{border-left:3px solid var(--ink);color:var(--ink);background:var(--surface-2);border-radius:0 9px 9px 0;padding-right:12px}
.br.on .if{color:var(--ink);font-weight:600}.br.on .tq{font-weight:600;font-size:17px}
.br.on .tag{display:inline-block;font-size:13px;font-weight:700;border:1px solid var(--ink);border-radius:5px;padding:1px 7px;margin-left:6px}
.br.off .tq{text-decoration:line-through;text-decoration-color:var(--hs)}
.br .lnk{font-size:13px}
.br.on .lnk{color:var(--ink)}
.face .yn{margin-top:auto}
.sp{display:inline-block;width:14px}</style></head><body><div class="app" id="app"></div><script>const Q=location.search;let L=(Q.match(/lang=(en|zh)/)||[])[1]||'en';
let TH=/theme=light/.test(Q)?'light':'dark';
const applyTheme=()=>document.documentElement.setAttribute('data-theme',TH==='light'?'light':'');applyTheme();
const syncURL=()=>{const u=new URL(location.href);L==='zh'?u.searchParams.set('lang','zh'):u.searchParams.delete('lang');TH==='light'?u.searchParams.set('theme','light'):u.searchParams.delete('theme');history.replaceState(null,'',u.pathname+u.search+u.hash)};
const T=(z,e)=>L==='zh'?z:e;
const FORBES='https://www.forbes.com/?utm_source=axiom&utm_medium=midterm-tracker&utm_campaign=forbes-article';
const EX=()=>'<span class="ex">'+T('示例','Example')+'</span>';
const hhmm=()=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
const sw=()=>'<div class="sw"><button onclick="E.lang(\'en\')">'+(L==='en'?'<b>EN</b>':'EN')+'</button>|<button onclick="E.lang(\'zh\')">'+(L==='zh'?'<b>粵</b>':'粵')+'</button></div><div class="sw"><button onclick="E.theme(\'dark\')">'+(TH==='dark'?'<b>'+T('深','Dark')+'</b>':T('深','Dark'))+'</button>|<button onclick="E.theme(\'light\')">'+(TH==='light'?'<b>'+T('淺','Light')+'</b>':T('淺','Light'))+'</button></div>';
const hdr=t=>'<div class="top"><div class="t">'+t+' '+EX()+'</div>'+sw()+'</div>';
const PK=p=>p==='y'?T('會','Will'):T('唔會','Won\'t');
const PA=(label)=>'<a class="btn-p" href="'+FORBES+'" target="_blank" rel="noopener">'+label+' ↗</a>';
const FL=()=>'<a class="lnk" href="'+FORBES+'" target="_blank" rel="noopener">'+T('喺 Forbes 讀','Read on Forbes')+' ↗</a>';
function reg(title){if(!S.guest)return '<div class="reg"><div class="t">'+T('已存入你嘅 Forbes Predict 紀錄','Saved to your Forbes Predict record')+'</div><div class="meta">'+T('出 call 時間照舊：21 Oct '+S.at+' HKT','Call time kept: 21 Oct '+S.at+' HKT')+'</div></div>';
 if(S.later)return '';
 return '<div class="reg"><div class="t">'+title+'</div><div class="meta">'+T('會開一個 Forbes Predict 紀錄，同你嘅 Forbes.com 帳戶分開。出 call 用 Tokens，冇現金獎品。','This creates a Forbes Predict record, separate from your Forbes.com account. Calls use Tokens, and there are no cash prizes.')+'</div>'+
 (S.regOpen?'<div class="row"><div class="field">you@email.com</div><button class="btn-s sm" onclick="E.regDo()">'+T('保存','Save')+'</button></div>':'<div class="row"><button class="btn-s sm" onclick="E.regOpen()">'+T('用電郵保存','Save with your email')+'</button><button class="lnk" onclick="E.later()">'+T('遲啲先','Not now')+'</button></div>')+'</div>'}
const CE={lang(l){L=l;syncURL();R()},theme(t){TH=t;applyTheme();syncURL();R()},regOpen(){S.regOpen=true;R()},later(){S.later=true;R()},regDo(){S.guest=false;S.toast=T('已保存，call 時間照舊係 '+S.at+'。','Saved. Your call time stays '+S.at+'.');R()}};
function R(){applyTheme();document.documentElement.lang=L==='zh'?'zh-HK':'en';document.getElementById('app').innerHTML=V()+(S.toast?'<div class="toast">'+S.toast+'</div>':'');if(S.toast){S.toast='';clearTimeout(window._tt);window._tt=setTimeout(()=>{const el=document.querySelector('.toast');el&&el.remove()},1800)}}
let S;
function reset(){S={pick:null,at:null,rev:false,res:'y',guest:true,regOpen:false,later:false,toast:''}}reset();
const CROWD=58,N='2,317';
const pts=()=>S.pick&&S.rev?(S.pick===S.res?1:0):0;
const BR=()=>({y:[T('如果係會，聽日問：','If Will, tomorrow asks: '),T('新城市會唔會喺亞洲？','Will the new city be in Asia?'),T('跟進：NFL 點揀下一個海外城市','Follow-up: how the NFL picks its next city')],
 n:[T('如果係唔會，聽日問：','If Won\'t, tomorrow asks: '),T('球員工會會唔會公開反對加海外場？','Will the players\' union publicly oppose more overseas games?'),T('跟進：球員工會同聯盟嘅海外賽角力','Follow-up: union vs league on overseas games')]});
function line(k){const b=BR()[k],on=S.res===k;
 return '<div class="br '+(on?'on':'off')+'"><div class="if">'+b[0]+(on?'<span class="tag">'+T('聽日 22 Oct 嘅題','Tomorrow, 22 Oct')+'</span>':T('（冇開）',' (not opened)'))+'</div><div class="tq">'+b[1]+'</div><div class="fa"><span>'+b[2]+'</span>'+FL()+'</div></div>'}
function V(){let h=hdr('Forbes Predict');
 h+='<div class="kick">'+T('NFL：海外賽','NFL: overseas games')+'</div><div class="h1">'+T('NFL 老闆今日開會，傳 2027 年再加海外主場','NFL owners meet today; another overseas home city floated for 2027')+'</div><div class="meta" style="margin-top:8px">Forbes, 21 Oct'+'<span class="sp"></span>'+FL()+'</div>';
 h+='<div class="fork"><span class="n">21</span><span>'+T('今日','Today')+'</span><span class="ln"></span><span>'+(S.rev?T('聽日開咗「'+(S.res==='y'?'亞洲':'工會')+'」線','Tomorrow: the '+(S.res==='y'?'Asia':'union')+' line'):T('聽日開邊條線？','Which line opens tomorrow?'))+'</span><span class="n f">22</span></div>';
 const front='<div class="face fr"><div class="cd"><span>'+T('今日一問','Today\'s question')+'</span>'+'</div><div class="qq">'+T('NFL 會唔會宣布 2027 年加一個新海外城市？','Will the NFL announce a new overseas city for 2027?')+'</div>'+
  (S.pick?'<div class="you"><span class="meta">'+T('你嘅 call','Your call')+'</span><b>'+PK(S.pick)+'</b><span class="meta">21 Oct '+S.at+' HKT'+(S.rev?'':T('，等緊揭曉',', waiting for the reveal'))+'</span></div><div class="hint">'+T('聽日有兩條可能嘅問題，揭曉結果決定開邊條。','Two possible questions for tomorrow. The reveal decides which one opens.')+'</div>':
  '<div class="hint" style="margin-top:14px">'+T('揭曉結果決定聽日嘅問題','The result decides tomorrow’s question')+'</div><div class="yn" style="padding-top:14px"><button class="btn-s" onclick="E.call(\'y\')">'+T('會','Will')+'</button><button class="btn-s" onclick="E.call(\'n\')">'+T('唔會','Won\'t')+'</button></div>')+'</div>';
 /* Back face: never leak result before reveal */
 const back=S.rev
  ?('<div class="face bk"><div class="cd"><span>'+T('22 Oct 揭曉','Revealed 22 Oct')+'</span>'+'</div><div class="qq" style="font-size:20px">'+T('結果係'+PK(S.res)+'。你嘅 call：'+PK(S.pick),'Resolved '+PK(S.res)+'. Your call: '+PK(S.pick))+'</div>'+line(S.res)+line(S.res==='y'?'n':'y')+'</div>')
  :('<div class="face bk" aria-hidden="true"><div class="cd"><span>'+T('揭曉之後先見','After the reveal')+'</span>'+'</div><div class="qq" style="font-size:18px;color:var(--mute)">'+T('結果同聽日嘅問題，揭曉之後先見','The result and tomorrow’s question appear after the reveal')+'</div></div>');
 h+='<div class="card3'+(S.rev&&!S.noFl?' fl':'')+'" id="card"><div class="inner">'+front+back+'</div></div>';
 if(!S.pick)h+='<div class="meta" style="margin-top:10px">'+T('撳一下就出 call，之後就見到其他讀者點揀。','One tap makes your call. Then you see how other readers called it.')+'</div>';
 else{const mine=S.pick==='y'?CROWD:100-CROWD;
  h+='<div class="crowd"><div class="split"><i style="width:'+CROWD+'%"></i></div><div class="row"><span>'+T('會','Will')+' '+CROWD+'%</span><span>'+T('同你一樣 '+mine+'%，共 '+N+' 位讀者','Same as you: '+mine+'% of '+N+' readers')+'</span><span>'+T('唔會','Won\'t')+' '+(100-CROWD)+'%</span></div></div>';
  if(!S.rev)h+='<div class="demo"><span class="meta">'+T('預覽揭曉','Preview the reveal')+'</span><button class="btn-s sm" id="btn-reveal" onclick="E.reveal()">'+T('預覽揭曉','Preview the reveal')+'</button></div>';
  else h+='<div class="demo"><span class="meta">'+T('睇另一條問題','See the other question')+'</span><button class="btn-s sm" onclick="E.swap()">'+T('睇另一個結果','Try the other result')+'</button></div>';
  if(!S.rev)h+='<div class="score"><div><b style="font-size:18px">'+T('等緊揭曉','Waiting for the reveal')+'</b><span>'+T('揭曉之後先有分數','Your score appears after the reveal')+'</span></div><div><span style="font-size:14px">'+T('一日一題，聽日嘅題目唔影響分數。','One question a day. Tomorrow’s question doesn’t change your score.')+'</span></div></div>';
  else h+='<div class="score"><div><b>'+(pts()===0?T('0 分','0 points'):pts()+' '+T('分','points'))+'</b><span>'+T('你嘅分數','Your score')+'</span></div><div><span style="font-size:14px">'+T('一日一題，聽日嘅題目唔影響分數。','One question a day. Tomorrow’s question doesn’t change your score.')+'</span></div></div>';
  h+=reg(S.rev?T('留低電郵，聽日提你','Leave your email and we\'ll remind you tomorrow'):T('留低電郵，聽日話你開邊條問題','Leave your email and we\'ll tell you which question opens'))}
 h+='<div class="foot">'+T('出 call 用 Tokens，冇現金獎品。','Calls use Tokens. There are no cash prizes.')+'</div>';
 const cap=S.rev?T('跟進報道','The follow-up'):T('今日 Forbes 報道','Today’s Forbes story');
 h+='<div class="dock"><div class="in"><div class="cap"><span>'+cap+'</span><span>'+(S.rev?'22 Oct':'21 Oct')+'</span></div>'+PA(S.rev?T('喺 Forbes 讀跟進報道','Read the follow-up on Forbes'):T('喺 Forbes 讀','Read on Forbes'))+'</div></div>';
 return h}
const E=Object.assign({},CE,{
 call(p){if(S.rev||S.pick)return;S.pick=p;S.at=S.at||hhmm();S.toast=T('已出 call，'+S.at,'Call made at '+S.at);R()},
 reveal(){if(!S.pick||S.rev)return;S.rev=true;S.noFl=true;R();S.noFl=false;const c=document.getElementById('card');c.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>c.classList.add('fl'),350)},
 swap(){if(!S.rev)return;S.res=S.res==='y'?'n':'y';R()}});
window.E=E;
if(/demo=reveal/.test(Q)){S.pick=(Q.match(/pick=(y|n)/)||[])[1]||'y';S.res=(Q.match(/res=(y|n)/)||[])[1]||'y';S.at='09:41';S.rev=true}
R();
</script></body></html>
