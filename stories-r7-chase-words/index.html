[data-theme=light]{--bg:#fff;--ink:#111;--body:#4d4d4d;--mute:#666;--dim:#808080;--hair:#e6e6e6;--hair-strong:#cfcfcf;--btn:#000;--btn-ink:#fff;--icon-ink:#111;--icon-body:#9a9a9a;--surface:#f6f6f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--detail);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{width:20px;height:20px;flex:none}svg.sm{width:16px;height:16px}
.i{stroke:var(--icon-ink)}.i[fill=currentColor]{fill:var(--icon-ink)}.b{stroke:var(--icon-body)}.b[fill=currentColor]{fill:var(--icon-body)}[stroke=none]{stroke:none}
.app{max-width:390px;margin:0 auto;min-height:100vh;padding:0 20px 140px;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;min-height:56px}
.top .t{flex:1;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;min-width:0}
.top .back{min-width:44px;min-height:44px;display:flex;align-items:center;margin-left:-10px;padding-left:10px}
.tg{display:flex;align-items:center;font-size:13px;color:var(--dim)}
.tg button{min-width:30px;min-height:44px;color:var(--mute);font-size:13px;padding:0 3px}.tg button.on{color:var(--ink);font-weight:700}
.sep{width:1px;height:16px;background:var(--hair-strong);margin:0 4px}
.ex{display:inline-block;font-size:13px;color:var(--mute);border:1px dashed var(--hair-strong);border-radius:5px;padding:0 6px;line-height:20px}
.kick{font-size:13px;letter-spacing:.04em;color:var(--mute);margin-top:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ttl{font-family:var(--title);font-weight:600;letter-spacing:-.035em;line-height:1.12}
.h1{font-size:30px;margin-top:10px}.h2{font-size:22px}
.dek{color:var(--body);font-size:16px;margin-top:10px}
.meta{font-size:13px;color:var(--mute)}
.card{border-top:1px solid var(--hair);margin-top:22px;padding-top:16px}
.qq{font-size:19px;font-weight:600;line-height:1.35;margin-top:6px}
.btn-p{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:9px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;text-decoration:none}
.btn-p .i{stroke:var(--btn-ink)}
.btn-s{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:9px;border:1px solid var(--hair-strong);font-size:16px;color:var(--ink);text-decoration:none;padding:0 14px}
.btn-s.on{border:2px solid var(--ink);font-weight:700}
.lnk{color:var(--body);font-size:14px;text-decoration:underline;text-underline-offset:3px;display:inline-flex;gap:6px;align-items:center;min-height:44px}
.yn{display:flex;gap:10px;margin-top:14px}.yn>*{flex:1}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--hair);z-index:5}
.dock .in{max-width:390px;margin:0 auto;padding:12px 20px 20px}
.dock .sub{display:flex;justify-content:center;gap:18px;margin-top:4px;flex-wrap:wrap}
.para{color:var(--body);font-size:16px;margin-top:14px}
.lockrow{display:flex;gap:8px;margin-top:12px}
.spoon-wrap{position:relative}
.spoon{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);z-index:6;max-width:260px;padding:8px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;white-space:normal;text-align:center}
.spoon:after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
@media(min-width:520px){.spoon{display:none}}

.slot{flex:1;min-height:44px;border:1px dashed var(--hair-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px}
.words{display:flex;flex-direction:column;margin-top:8px}
.word{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--hair);text-decoration:none}
.word .w{flex:1}.word .w b{display:block;font-size:17px;font-weight:600}.word .w span{font-size:13px;color:var(--mute)}
.picked{font-family:var(--title);font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:4px}
.reg{margin-top:22px;border:1px solid var(--hair);border-radius:10px;padding:14px}
.reg .t{font-size:15px;font-weight:600}.reg .s{font-size:13px;color:var(--mute);margin-top:4px}
.reg .row{display:flex;gap:16px;align-items:center;margin-top:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);border-top:1px solid var(--hair-strong);width:100%;max-width:390px;padding:20px 20px 28px;border-radius:14px 14px 0 0}
.seg{display:flex;border:1px solid var(--hair-strong);border-radius:10px;padding:3px;margin-top:16px}
.seg button{flex:1;min-height:44px;border-radius:7px;font-size:15px;color:var(--mute)}
.seg button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ink)}
.lb{margin-top:10px}
.r{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--hair)}
.r .n{width:28px;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.r .nm{flex:1;min-width:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r .tag{font-size:13px;color:var(--mute);border:1px solid var(--hair-strong);border-radius:5px;padding:0 6px;line-height:20px}
.r .sc{font-family:var(--title);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.r.me{border-left:3px solid var(--ink);padding-left:10px;margin-left:-13px}
.r.me .nm{font-weight:700}
.days{display:flex;gap:6px;margin-top:10px}
.d{flex:1;text-align:center;border:1px solid var(--hair);border-radius:7px;padding:6px 0;font-size:13px;color:var(--mute)}
.d b{display:block;font-size:16px;color:var(--ink)}
.d.un{border-style:dashed}
.note{font-size:13px;color:var(--mute);margin-top:10px;display:flex;gap:6px;align-items:flex-start}
.soft{margin-top:14px;font-size:15px;color:var(--body)}
.soft b{color:var(--ink)}

  : '<div class="lockrow"><div class="slot">'+ic('lock','sm')+'</div><div class="slot">'+ic('lock','sm')+'</div><div class="slot">'+ic('lock','sm')+'</div></div><p class="note">'+T('出 call 之後先會顯示。','Shown after you make your call.')+'</p>')+'</div>'
};
const D={
home:()=>'<div class="in">'+nav('article','btn-p',ic('newspaper')+T('讀報道 · 出 call','Read story · make call'))+'</div>',
article:()=>'<div class="in spoon-wrap"><div class="spoon">'+T('撳呢度 · tip／原文喺 Forbes','Tap here · tip / full piece on Forbes')+'</div>'+ext(ART,'btn-p',T('讀 Forbes 原文','Read on Forbes')+ic('chevron-right','sm'))+'</div>'
};
R();
</script></body></html>
