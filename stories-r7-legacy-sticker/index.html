<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stories R7 · Legacy 貼紙</title><style>:root{--bg:#000;--ink:#ededed;--body:#a1a1a1;--mute:#8f8f8f;--dim:#6a6a6a;--hair:#262626;--hs:#3d3d3d;--surface:#0a0a0a;--surface-2:#1a1a1a;--btn:#ededed;--btn-ink:#000;--overlay:rgba(0,0,0,.7);--split-track:#262626;--title:Graphik,'Helvetica Neue',Arial,sans-serif;--detail:Inter,system-ui,-apple-system,'PingFang HK','Noto Sans CJK TC',sans-serif}
[data-theme=light]{--bg:#fff;--ink:#111;--body:#4d4d4d;--mute:#6f6f6f;--dim:#8a8a8a;--hair:#e6e6e6;--hs:#d4d4d4;--surface:#fafafa;--surface-2:#f0f0f0;--btn:#111;--btn-ink:#fff;--overlay:rgba(0,0,0,.35);--split-track:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--detail);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit}
.app{max-width:390px;margin:0 auto;min-height:100vh;position:relative;padding:0 20px 180px;overflow-x:hidden}
.top{display:flex;align-items:center;gap:10px;height:56px}
.top .t{flex:1;font-size:13px;color:var(--mute)}
.sw{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}.sw b{color:var(--ink);font-weight:600}.sw button{position:relative;min-width:22px}.sw button::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.ex{font-size:13px;color:var(--dim)}
.kick{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:18px}
.h1{font-family:var(--title);font-weight:600;letter-spacing:-.035em;font-size:31px;line-height:1.1;margin-top:10px}
.meta{font-size:13px;color:var(--mute)}
.body{color:var(--body)}
.btn-p{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:9px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;text-decoration:none}
.btn-s{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:9px;border:1px solid var(--hs);font-size:16px;font-weight:600;color:var(--ink)}
.btn-s.sm{min-height:44px;height:44px;padding:0 14px;font-size:14px;font-weight:500}
.lnk{color:var(--body);font-size:14px;text-decoration:underline;text-underline-offset:3px;display:inline-flex;gap:6px;align-items:center;position:relative}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--hair);z-index:5}
.dock .in{max-width:390px;margin:0 auto;padding:10px 20px 22px}.dock .cap{font-size:13px;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.q{margin-top:26px;border-top:1px solid var(--hair);padding-top:16px}
.q .lab{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.q .qq{font-family:var(--title);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:6px}
.yn{display:flex;gap:10px;margin-top:14px}.yn>*{flex:1}
.you{display:flex;gap:8px;align-items:baseline;margin-top:12px;font-size:15px}.you b{font-family:var(--title);font-size:26px;letter-spacing:-.03em}
.crowd{margin-top:14px}.split{height:8px;border-radius:4px;background:var(--split-track);overflow:hidden}.split i{display:block;height:100%;background:var(--body);transition:width .6s}
.crowd .row{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--mute)}
.demo{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 0;border-top:1px dashed var(--hs);border-bottom:1px dashed var(--hs)}.demo .meta{flex:1}
.reg{margin-top:22px;margin-bottom:12px;border-left:2px solid var(--ink);padding:2px 0 2px 14px;position:relative;z-index:2}.reg .t{font-size:16px;font-weight:600}.reg .meta{margin-top:4px}
.reg .row{display:flex;gap:16px;align-items:center;margin-top:12px}
.field{min-height:44px;height:44px;border:1px solid var(--hs);border-radius:9px;display:flex;align-items:center;padding:0 12px;color:var(--dim);flex:1;font-size:14px}
.score{display:flex;gap:28px;margin-top:18px;padding-top:14px;border-top:1px solid var(--hair)}.score b{display:block;font-family:var(--title);font-size:28px;letter-spacing:-.03em}.score span{font-size:13px;color:var(--mute)}
.res{font-family:var(--title);font-size:24px;font-weight:600;margin-top:16px;border-left:2px solid var(--ink);padding-left:12px;letter-spacing:-.02em}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--hs);border-radius:9px;padding:8px 14px;font-size:13px;z-index:10;white-space:nowrap}
.foot{margin-top:28px;font-size:13px;color:var(--dim)}
.board{margin-top:22px;position:relative}
.board .bh{display:flex;justify-content:space-between;align-items:baseline}.board .bh b{font-size:16px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;position:relative}
.slots:before{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:1px dashed var(--hs);z-index:0}
.slot{aspect-ratio:3/4.4;border:1px dashed var(--hs);border-radius:8px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:13px;color:var(--dim);background:var(--bg);z-index:1}
.slot.tod{border:2px solid var(--ink);color:var(--ink);font-weight:600}
.slot .d{position:absolute;top:4px;left:0;right:0;text-align:center}
.stk{position:absolute;inset:26px 5px 6px;border-radius:7px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-weight:700;line-height:1.1;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--hs),2px 4px 0 3px var(--surface-2);transform:rotate(var(--r,-4deg))}
.stk small{font-size:13px;font-weight:600}.stk .g{font-family:var(--title);font-size:20px;letter-spacing:-.03em}
.stk:after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;background:linear-gradient(135deg,transparent 50%,var(--body) 50%);border-radius:0 0 7px 0}
.stk.old{background:var(--surface-2);color:var(--ink);box-shadow:0 0 0 1px var(--hs)}
.stk.old:after{background:linear-gradient(135deg,transparent 50%,var(--hs) 50%)}
.stk.new{animation:slap .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slap{0%{transform:translateY(-140px) scale(1.9) rotate(18deg);opacity:0}60%{opacity:1}100%{transform:rotate(var(--r,-4deg))}}
.legend{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.flash{margin-top:16px;padding:14px;border:2px solid var(--ink);border-radius:9px;display:flex;gap:14px;align-items:center;text-decoration:none}
.flash .bigstk{width:64px;height:76px;flex:none;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;transform:rotate(-5deg);box-shadow:2px 4px 0 0 var(--surface-2)}
.flash .bigstk .g{font-family:var(--title);font-size:22px}
.flash .t1{font-size:15px;font-weight:600;line-height:1.3}.flash .t2{font-size:13px;color:var(--mute);margin-top:4px}
small{font-size:13px}
</style></head><body><div class="app" id="app"></div><script>const Q=location.search;let L=(Q.match(/lang=(en|zh)/)||[])[1]||'en';
let TH=/theme=light/.test(Q)?'light':'dark';
const applyTheme=()=>document.documentElement.setAttribute('data-theme',TH==='light'?'light':'');applyTheme();
const syncURL=()=>{const u=new URL(location.href);L==='zh'?u.searchParams.set('lang','zh'):u.searchParams.delete('lang');TH==='light'?u.searchParams.set('theme','light'):u.searchParams.delete('theme');history.replaceState(null,'',u.pathname+u.search+u.hash)};
const T=(z,e)=>L==='zh'?z:e;
const FORBES='https://www.forbes.com/?utm_source=axiom&utm_medium=midterm-tracker&utm_campaign=forbes-article';
const EX=()=>'<span class="ex">'+T('示例','Example')+'</span>';
const hhmm=()=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
const sw=()=>'<div class="sw"><button onclick="E.lang(\'en\')">'+(L==='en'?'<b>EN</b>':'EN')+'</button>|<button onclick="E.lang(\'zh\')">'+(L==='zh'?'<b>粵</b>':'粵')+'</button></div><div class="sw"><button onclick="E.theme(\'dark\')">'+(TH==='dark'?'<b>'+T('深','Dark')+'</b>':T('深','Dark'))+'</button>|<button onclick="E.theme(\'light\')">'+(TH==='light'?'<b>'+T('淺','Light')+'</b>':T('淺','Light'))+'</button></div>';
const hdr=t=>'<div class="top"><div class="t">'+t+' · '+EX()+'</div>'+sw()+'</div>';
const PK=p=>p==='y'?T('會','Will'):T('唔會','Won\'t');
const PA=(label)=>'<a class="btn-p" href="'+FORBES+'" target="_blank" rel="noopener">'+label+' ↗</a>';
const FL=()=>'<a class="lnk" href="'+FORBES+'" target="_blank" rel="noopener">'+T('喺 Forbes 讀','Read on Forbes')+' ↗</a>';
function reg(title){if(!S.guest)return '<div class="reg"><div class="t">'+T('已存入你嘅 Forbes Predict 紀錄','Saved to your Forbes Predict record')+'</div><div class="meta">'+T('出 call 時間照舊：21 Oct '+S.at+' HKT','Call time kept: 21 Oct '+S.at+' HKT')+'</div></div>';
 if(S.later)return '';
 return '<div class="reg"><div class="t">'+title+'</div><div class="meta">'+T('會開一個 Forbes Predict 紀錄，同你嘅 Forbes.com 帳戶分開。出 call 用 Tokens，冇現金獎品。','This creates a Forbes Predict record, separate from your Forbes.com account. Calls use Tokens, and there are no cash prizes.')+'</div>'+
 (S.regOpen?'<div class="row"><div class="field">you@email.com</div><button class="btn-s sm" onclick="E.regDo()">'+T('保存','Save')+'</button></div>':'<div class="row"><button class="btn-s sm" onclick="E.regOpen()">'+T('用電郵保存','Save with your email')+'</button><button class="lnk" onclick="E.later()">'+T('遲啲先','Not now')+'</button></div>')+'</div>'}
const CE={lang(l){L=l;syncURL();R()},theme(t){TH=t;applyTheme();syncURL();R()},regOpen(){S.regOpen=true;R()},later(){S.later=true;R()},regDo(){S.guest=false;S.toast=T('已保存，call 時間照舊係 '+S.at+'。','Saved. Your call time stays '+S.at+'.');R()}};
function R(){applyTheme();document.documentElement.lang=L==='zh'?'zh-HK':'en';document.getElementById('app').innerHTML=V()+(S.toast?'<div class="toast">'+S.toast+'</div>':'');if(S.toast){S.toast='';clearTimeout(window._tt);window._tt=setTimeout(()=>{const el=document.querySelector('.toast');el&&el.remove()},1800)}}
let S;
function reset(){S={pick:null,at:null,rev:false,res:'y',guest:true,regOpen:false,later:false,toast:''}}reset();
const CROWD=63,N='1,284';
/* past stickers already on this Story board */
const OLD=()=>[['14 Oct',T('預告','Trailer'),'-3deg'],['16 Oct',T('定價','Price'),'4deg'],['18 Oct',T('冇延','On time'),'-6deg']];
const pts=()=>S.pick&&S.rev?(S.pick===S.res?1:0):0;
function board(){const old=OLD().map(o=>'<div class="slot"><span class="d">'+o[0]+'</span><a class="stk old" style="--r:'+o[2]+'" href="'+FORBES+'" target="_blank" rel="noopener" aria-label="'+T('喺 Forbes 讀','Read on Forbes')+'"><small>'+o[1]+'</small></a></div>').join('');
 const today='<div class="slot tod"><span class="d">21 Oct</span>'+(S.rev?'<a class="stk new" style="--r:-5deg" href="'+FORBES+'" target="_blank" rel="noopener" aria-label="'+T('喺 Forbes 讀跟進報道','Read the follow-up on Forbes')+'"><span class="g">·</span><small>'+PK(S.res)+'</small></a>':'<span style="font-size:22px;margin:auto">'+(S.pick?'…':'?')+'</span>')+'</div>';
 const fut='<div class="slot"><span class="d">22 Oct</span><span style="margin:auto">'+T('聽日','Tomorrow')+'</span></div>';
 return '<div class="board" id="board"><div class="bh"><b>'+T('你嘅貼紙','Your stickers')+'</b><span class="meta">'+T('每次揭曉加一張貼紙，一直留住','Each reveal adds a sticker that stays')+'</span></div><div class="slots">'+old+today+fut+'</div>'+
 '<div class="legend"><span>'+T('撳貼紙，喺 Forbes 讀跟進報道','Tap a sticker to read the follow-up on Forbes')+'</span></div></div>'}
function V(){let h=hdr('Forbes Predict');
 h+='<div class="kick">'+T('GTA VI：出街倒數','GTA VI: the countdown')+'</div><div class="h1">'+T('Rockstar 再確認 GTA VI 11 月 19 日出，分析師仲有保留','Rockstar reaffirms GTA VI for Nov 19; analysts hedge')+'</div><div class="meta" style="margin-top:8px">Forbes · 21 Oct'+' · '+FL()+'</div>';
 h+=board();
 h+='<div class="q"><div class="lab"><span>'+T('今日一問','Today\'s question')+'</span>'+'</div><div class="qq">'+T('GTA VI 會唔會照 11 月 19 日出？','Will GTA VI ship on Nov 19?')+'</div>';
 if(!S.pick){h+='<div class="yn"><button class="btn-s" onclick="E.call(\'y\')">'+T('會','Will')+'</button><button class="btn-s" onclick="E.call(\'n\')">'+T('唔會','Won\'t')+'</button></div><div class="meta" style="margin-top:8px">'+T('撳一下就出 call，之後就見到其他讀者點揀。','One tap makes your call. Then you see how other readers called it.')+'</div>'}
 else{const mine=S.pick==='y'?CROWD:100-CROWD;
  h+='<div class="you"><span class="meta">'+T('你嘅 call','Your call')+'</span><b>'+PK(S.pick)+'</b><span class="meta">21 Oct '+S.at+' HKT'+(S.rev?'':T('，等緊揭曉',', waiting for the reveal'))+'</span></div>'+
  '<div class="crowd"><div class="split"><i style="width:'+CROWD+'%"></i></div><div class="row"><span>'+T('會','Will')+' '+CROWD+'%</span><span>'+T('同你一樣 ','Same as you ')+mine+'% · '+N+T(' 人',' readers')+'</span><span>'+T('唔會','Won\'t')+' '+(100-CROWD)+'%</span></div></div>';
  if(!S.rev)h+='<div class="demo"><span class="meta">'+T('睇吓揭曉之後點樣','See how the reveal looks')+'</span><button class="btn-s sm" id="btn-reveal" onclick="E.reveal()">'+T('預覽揭曉','Preview the reveal')+'</button></div>';
  else h+='<div class="res">'+T('結果係'+PK(S.res)+'。你嘅 call：'+PK(S.pick),'Resolved '+PK(S.res)+'. Your call: '+PK(S.pick))+'</div>'+
   '<a class="flash" href="'+FORBES+'" target="_blank" rel="noopener"><div class="bigstk"><span class="g">·</span><small>'+PK(S.res)+'</small></div><div><div class="t1">'+T('已加入你嘅貼紙。跟進報道：GTA VI 準時開賣，首日數字點睇','Added to your stickers. Follow-up: GTA VI launches on time — day-one numbers')+'</div><div class="t2">'+T('撳貼紙讀跟進','Tap the sticker to read')+'</div></div></a>';
  if(!S.rev)h+='<div class="score"><div><b style="font-size:18px">'+T('等緊揭曉','Waiting for the reveal')+'</b><span>'+T('揭曉之後先有分數','Your score appears after the reveal')+'</span></div><div><span style="font-size:14px">'+T('你嘅分數','Your score')+'</span></div></div>';
  else h+='<div class="score"><div><b>'+(pts()===0?T('0 分','0 points'):pts()+' '+T('分','points'))+'</b><span>'+T('你嘅分數','Your score')+'</span></div><div><span style="font-size:14px">'+T('貼紙唔影響分數','Stickers don\'t change your score')+'</span></div></div>';
  h+=reg(T('保存你個 call 同貼紙','Save your call and sticker'))}
 h+='</div><div class="foot">'+T('出 call 用 Tokens，冇現金獎品。','Calls use Tokens. There are no cash prizes.')+'</div>';
 const cap=S.rev?T('跟進報道','The follow-up'):T('今日 Forbes 報道','Today’s Forbes story');
 h+='<div class="dock"><div class="in"><div class="cap"><span>'+cap+'</span><span>'+(S.rev?'Forbes, 20 Nov':'Forbes, 21 Oct')+'</span></div>'+PA(S.rev?T('喺 Forbes 讀跟進報道','Read the follow-up on Forbes'):T('喺 Forbes 讀','Read on Forbes'))+'</div></div>';
 return h}
const E=Object.assign({},CE,{
 call(p){if(S.rev||S.pick)return;S.pick=p;S.at=S.at||hhmm();S.toast=T('已出 call，'+S.at,'Call made at '+S.at);R()},
 reveal(){if(!S.pick||S.rev)return;S.rev=true;R();const b=document.getElementById('board');b&&b.scrollIntoView({behavior:'smooth',block:'start'})}});
window.E=E;
if(/demo=reveal/.test(Q)){S.pick=(Q.match(/pick=(y|n)/)||[])[1]||'y';S.at='09:41';S.rev=true}
R();
</script></body></html>
