<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stories R7 · 故事路線圖</title><style>:root{--bg:#000;--ink:#ededed;--body:#a1a1a1;--mute:#8f8f8f;--dim:#6a6a6a;--hair:#262626;--hs:#3d3d3d;--surface:#0a0a0a;--surface-2:#1a1a1a;--btn:#ededed;--btn-ink:#000;--overlay:rgba(0,0,0,.7);--split-track:#262626;--title:Graphik,'Helvetica Neue',Arial,sans-serif;--detail:Inter,system-ui,-apple-system,'PingFang HK','Noto Sans CJK TC',sans-serif}

.body{color:var(--body)}

.nd.done{background:var(--bg);border:1.5px solid var(--hs);color:var(--dim);box-shadow:none;font-size:12px;width:44px;height:44px;min-width:44px;min-height:44px}
.nd.miss{background:var(--bg);border:1.5px dashed var(--hs);color:var(--dim);font-size:12px;width:44px;height:44px;min-width:44px;min-height:44px}

@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.nd.lock{background:var(--surface-2);color:var(--dim);font-weight:600;border:2px solid var(--hs)}
.nl{position:absolute;font-size:13px;color:var(--mute);line-height:1.35}
.nl b{display:block;color:var(--ink);font-size:14px;font-weight:600;line-height:1.3;margin-top:2px}

.pred .chip.called{border-color:var(--ink);color:var(--ink)}
.pred .chip.vacant{border-style:dashed;color:var(--dim);background:var(--surface)}

.pred .hint{font-size:11px;color:var(--dim);line-height:1.25}
.nr{position:absolute;font-size:13px;color:var(--mute);line-height:1.35}
.nr b{display:block;color:var(--ink);font-size:14px;font-weight:600;line-height:1.3}
.nr .past-meta{display:block;font-size:12px;color:var(--dim);margin-top:2px}
small{font-size:13px!important}
</style></head><body><div class="app" id="app"></div><script>

function heat(){const n=HEAT_BASE+S.claps;const on=S.claps>0?' on':'';const pop=S.clapPop?' pop':'';return '<div class="heat"><button class="clap'+on+pop+'" onclick="E.clap()" aria-label="'+T('拍手（唔計分）','Clap (does not score)')+'">'+clapIcon()+'</button><div class="clap-n">'+fmtN(n)+'</div><div class="info"><div class="t1">'+T('文章好熱鬧','Article feels lively')+'</div><div class="t2">'+T('主持同大家喺度講緊 · 拍手淨好玩，唔入分','Mods + crowd are live · claps are play, not scored')+'</div></div></div>'}

function reg(title){if(!S.guest)return '<div class="reg"><div class="t">'+T('已保存 Predict 紀錄','Predict record saved')+'</div><div class="meta">'+T('出 call 時間照舊：21 Oct '+S.at+' HKT','Call time kept: 21 Oct '+S.at+' HKT')+'</div><div class="row"><button class="lnk" onclick="E.top()">'+T('↑ 返去 Story 繼續睇','↑ Back to the Story')+'</button></div></div>';
 if(S.later)return '<div class="reg"><div class="meta">'+T('未保存 · 你個 call 只喺呢部機','Not saved · call lives on this device only')+'</div><div class="row"><button class="lnk" onclick="E.unlater()">'+T('保存','Save')+'</button></div></div>';
 return '<div class="reg" id="reg"><div class="t">'+title+'</div><div class="meta">'+T('開 Forbes Predict 紀錄，唔係 Forbes.com 帳戶 · 淨係 Tokens。冇現金獎品。','Opens a Forbes Predict record, not a Forbes.com account · Tokens only. No cash prizes.')+'</div>'+
 (S.regOpen?'<div class="row"><div class="field">you@email.com</div><button class="btn-s sm" onclick="E.regDo()">'+T('保存','Save')+'</button></div>':'<div class="row"><button class="btn-s sm" onclick="E.regOpen()">'+T('留電郵保存','Save with email')+'</button><button class="lnk" onclick="E.later()">'+T('遲啲先','Later')+'</button></div>')+'</div>'}
const CROWDV=(c,n,pick)=>{const mine=pick==='y'?c:100-c;return '<div class="crowd"><div class="split"><i style="width:'+c+'%"></i></div><div class="row"><span>'+T('會','Will')+' '+c+'%</span><span>'+T('同你一樣 ','Same as you ')+mine+'% · '+n+T(' 人',' readers')+'</span><span>'+T('唔會','Won\'t')+' '+(100-c)+'%</span></div></div>'};
const YN=()=>'<div class="yn"><button class="btn-p" onclick="E.call(\'y\')">'+T('會','Will')+'</button><button class="btn-s" onclick="E.call(\'n\')">'+T('唔會','Won\'t')+'</button></div><div class="meta" style="margin-top:8px">'+T('撳一下即出 call · 出咗 call 先見大家點揀','One tap makes the call · crowd shows after')+'</div>';
const YOU=()=>'<div class="you"><span class="meta">'+T('你揀咗','You said')+'</span><b>'+PK(S.pick)+'</b><span class="meta">21 Oct '+S.at+' HKT'+(S.rev?'':' · '+T('已出 call · 等揭曉','Called · awaiting reveal'))+'</span></div>';
const DEMO=()=>S.pick&&!S.rev?'<div class="demo"><span class="meta">'+T('跳到揭曉日','Skip to reveal day')+'</span><button class="btn-s sm" onclick="E.reveal()">'+T('跳到揭曉','Skip to reveal')+'</button></div>':'';
const RES=()=>'<div class="res">'+T('結果：'+PK(S.res)+'· 你揀咗 '+PK(S.pick),'Result: '+PK(S.res)+' · you said '+PK(S.pick))+'</div>';
const FOOT=()=>'<div class="foot">'+T('淨係 Tokens。冇現金獎品。','Tokens only. No cash prizes.')+'</div>';
const pts=()=>S.pick&&S.rev?(S.pick===S.res?1:0):0;
let S;
function reset(){S={pick:null,at:null,rev:false,res:'y',guest:true,regOpen:false,later:false,toast:'',claps:0,clapPop:false,artOpen:false}}reset();
const CROWD=61,N='1,972';
/* past days: [date, q zh, q en, result, your pick or null] */
const PAST=()=>[['16 Oct','BTC 收市會唔會企穩 $65k？','Will BTC close above $65k?','y','y'],['17 Oct','ETF 單日淨流入會唔會過 $5 億？','Will ETF net inflows top $500M in a day?','n',null],['18 Oct','MicroStrategy 會唔會再增持？','Will MicroStrategy buy more?','y','n'],['19 Oct','週末會唔會跌穿 $63k？','Will BTC dip below $63k this weekend?','n','n'],['20 Oct','SEC 會唔會批新 ETF？','Will the SEC approve a new ETF?','y','y']];
const OFF=[0,-80,-100,-50,40,90,30];const RH=128;
function predLeft(i,cx,html){const x=cx(i);const sz=i===PAST().length?80:44;const w=Math.max(72,x-sz/2-8);return '<div class="pred" style="top:'+(i*RH+40-18)+'px;left:0;width:'+w+'px">'+html+'</div>'}
function rightLab(i,cx,html){const x=cx(i);const sz=i===PAST().length?80:44;return '<div class="nr" style="top:'+(i*RH+18)+'px;left:'+(x+sz/2+12)+'px;right:0">'+html+'</div>'}
function route(){const P=PAST(),n=P.length+2,W=350,cx=i=>W/2+OFF[i];let pts=[],h='';
 for(let i=0;i<n;i++)pts.push([cx(i),i*RH+40]);
 let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<n;i++){const a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=' C'+a[0]+' '+my+' '+b[0]+' '+my+' '+b[0]+' '+b[1]}
 h+='<div class="route" style="height:'+(n*RH)+'px"><svg viewBox="0 0 '+W+' '+(n*RH)+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="var(--hs)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18"/></svg>';
 P.forEach((p,i)=>{const sz=44,x=cx(i)-sz/2,y=i*RH+40-sz/2;
  const sc=p[4]?(p[4]===p[3]?'+1':'0'):'0';
  const cls=p[4]?'done':'miss';
  h+='<div class="nd '+cls+'" style="left:'+x+'px;top:'+y+'px" aria-label="'+p[0]+'"><span>'+PK(p[3])+'</span><span class="sc">'+sc+'</span></div>';
  /* LEFT of circle = prediction state */
  if(p[4])h+=predLeft(i,cx,'<span class="chip called">'+T('你揀咗 ','You said ')+PK(p[4])+'</span><span class="hint">'+p[0]+'</span>');
  else h+=predLeft(i,cx,'<span class="chip vacant">'+T('未出 call','No call yet')+'</span><span class="hint">'+T('嗰日冇出 = 0','Missed day = 0')+'</span>');
  h+=rightLab(i,cx,'<b>'+T(p[1],p[2])+'</b><span class="past-meta">'+T('結果：'+PK(p[3]),'Result: '+PK(p[3]))+'</span>')});
 const t=P.length,tx=cx(t)-40,ty=t*RH+40-40;
 const todLabel=S.rev?PK(S.res):(S.pick?PK(S.pick):T('今日','Today'));
 const todSmall=S.rev?(S.pick===S.res?'+1':'0'):(S.pick?T('等揭曉','pending'):'21 Oct');
 h+='<button class="nd tod'+(S.rev?' rv':'')+(S.pick?'':' pulse')+'" id="today" style="left:'+tx+'px;top:'+ty+'px" onclick="E.goq()"><span>'+todLabel+'</span><small>'+todSmall+'</small></button>';
 /* LEFT of today circle = prediction affordance / state */
 if(S.pick)h+=predLeft(t,cx,'<span class="chip called">'+T('你揀咗 ','You said ')+PK(S.pick)+'</span><span class="hint">'+(S.rev?T('已揭曉','Revealed'):T('已出 call','Called'))+'</span>');
 else h+=predLeft(t,cx,'<button class="chip go" onclick="E.goq()">'+T('出 call','Make your call')+'</button><span class="hint">'+T('未預測 · 撳去答','No prediction yet')+'</span>');
