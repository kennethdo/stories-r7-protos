function forbesURL(hintId){

function V_timeline(){

 st.past.forEach(p=>{
  const called=p[2]!=null;

 });

 h+='</div>';

function V_call(){
 const st=STORIES[S.sid];
 let h=hdr()+rail()+arcChips();
 h+='<div class="kick"><span class="chip lead">'+T(st.leadTag[0],st.leadTag[1])+'</span></div>';
 h+='<div class="qq">'+T(st.q[0],st.q[1])+'</div>';
 h+='<div class="meta">21 Oct · '+T('領頭 market · 示例','Leading market · example')+'</div>';
 h+=why('leading',T('Chris：aggregate／leading market','Chris: aggregate / leading market'),
  T('唔要 30–40 component。一個領頭題＝niche 裏面嘅主流問題。','No 30–40 components. One leading market = mainstream Q inside the niche.'));
 h+='<p class="nar">'+T('撳一下即出 call。出咗先見 crowd split。','One tap makes the call. Crowd split unlocks after.')+'</p>';
 if(!S.pick){
  h+='<div class="yn" style="margin-top:18px"><div class="spoon-wrap" style="flex:1">'+spoon('call-yes',T('撳「會」或「唔會」出 call','Tap Yes or No to call'))+'<button class="btn-p" onclick="E.call(\'y\')">'+T('會','Yes')+'</button></div><button class="btn-s" onclick="E.call(\'n\')">'+T('唔會','No')+'</button></div>';
 }else{
  h+='<div class="you"><span class="meta">'+T('你揀咗','You said')+'</span><b>'+PK(S.pick)+'</b><span class="meta">21 Oct '+S.at+' HKT · '+T('已出 call','Called')+'</span></div>';
 }
 h+='<div style="margin-top:14px">'+forbesLnk(T('喺 Forbes.com 打開（未 call 都得）','Open on Forbes.com (even before a call)'),'call-always')+'</div>';
 h+=togBar()+FOOT();
 if(S.pick){
  h+='<div class="dock"><div class="in spoon-wrap">'+spoon('to-crowd',T('跟住見 crowd 張力','Next: crowd tension'))+'<div class="cap"><span>'+T('已出 call','Called')+'</span>'+EX()+'</div><button class="btn-p" onclick="E.go(\'crowd\')">'+T('睇大家點揀','See the crowd split')+'</button></div></div>';
 }else{
  h+='<div class="dock"><div class="in"><div class="cap"><span>'+T('出 call 先解鎖下一步','Call to unlock the next beat')+'</span>'+forbesLnk(T('Forbes','Forbes'),'call-dock')+'</div></div></div>';
 }
 return h;

 h+=togBar()+FOOT();

function V_save(){
 let h=hdr()+rail()+arcChips();
 h+='<div class="kick">'+T('保存 · 返嚟','Save · return')+'</div>';
 h+='<div class="h1">'+T('今日格已鎖 · 聽日再開','Today’s cell locked · opens tomorrow')+'</div>';
 h+=why('save',T('Tony：day-1 · 一 branch 一 session','Tony: day-1 · one branch one session'),
  T('保存係為咗返嚟，唔係為咗開空 comment。','Save is for return — not to open empty comments.'));
 if(!S.saved){

  h+='<div style="margin-top:12px" class="spoon-wrap">'+spoon('save-btn',T('撳保存 · 再睇 top callers','Tap save · then top callers'))+'<button class="btn-p" onclick="E.save()">'+T('保存 call','Save call')+'</button></div>';
  h+='<div style="margin-top:10px;text-align:center"><button class="lnk" onclick="E.go(\'board\')">'+T('遲啲先 · 先睇榜','Later · see the board first')+'</button></div></div>';
 }else{
  h+='<div class="save-box"><div class="t">'+T('已保存','Saved')+'</div><div class="meta" style="margin-top:4px">'+T('出 call 時間照舊：21 Oct '+S.at+' HKT','Call time kept: 21 Oct '+S.at+' HKT')+'</div></div>';
  h+='<p class="nar">'+T('聽日 22 Oct 格會開。漏咗唔使補 · 嗰日計 0。','Tomorrow’s 22 Oct cell opens then. Missed days stay 0 — no catch-up.')+'</p>';
 }
 h+=togBar()+FOOT();
 h+='<div class="dock"><div class="in spoon-wrap">'+spoon('to-board',T('Jeff：top callers #2','Jeff: top callers #2'))+'<div class="cap"><span>'+T('同一 Story 一條榜','One board per Story')+'</span>'+forbesLnk(T('Forbes','Forbes'),'save-dock')+'</div><button class="btn-p" onclick="E.go(\'board\')">'+T('睇 Top callers','See top callers')+'</button></div></div>';
 return h;

function V_board(){
 const st=STORIES[S.sid];
 let h=hdr()+rail()+arcChips();
 h+='<div class="kick">'+T('Top callers · 呢個 Story','Top callers · this Story')+'</div>';
 h+='<div class="h1">'+T('同一個分 · 一條榜','One score · one board')+'</div>';
 h+=why('board',T('Jeff：top callers #2','Jeff: top callers #2'),
  T('一 Story 一榜；「我站邊」同「點解佢哋第一」分開睇。','One board per Story; separate “my standing” from “why they’re top.”'));
 h+='<div class="board">';
 st.board.forEach(r=>{
  const you=r[1]==='You';
  h+='<div class="row'+(you?' you':'')+'"><span>'+r[0]+'</span><span>'+(you?T('你','You'):r[1])+(you?' · '+T('示例','Example'):'')+'</span><span class="sc">'+r[2]+'</span></div>';
 });
 h+='</div>';
 h+='<p class="meta" style="margin-top:8px">'+T('分數同名次係示例 · 徽章／提示唔入分','Scores and ranks are examples · badges / hints never enter the score')+'</p>';
 /* progressive disclosure */
 h+='<details class="more"'+(S.moreOpen?' open':'')+' onclick="E.more()"><summary>'+T('更多 markets（收起）','More markets (collapsed)')+' · '+T('唔喺主路','not on the main path')+'</summary>';
 st.more.forEach(m=>{h+='<div class="mkt"><b>'+T(m[0],m[1])+'</b><span class="meta">'+T('Pulse／chat／大表 → progressive disclosure','Pulse / chat / full grid → progressive disclosure')+'</span></div>'});
 h+='<p class="meta" style="margin-top:8px">'+T('Chris：唔要 component soup · 呢度先收起。','Chris: no component soup — parked here.')+'</p></details>';
 h+=why('done',T('收束','Close'),
  T('限制：非體育點算 live；CVR 循環；真 retention 要剔內部帳。','Limits: live for non-sports; CVR circularity; real retention after filtering internals.'));
 h+=togBar()+FOOT();
 h+='<div class="dock"><div class="in"><div class="cap"><span>'+T('Loop 完','Loop done')+'</span>'+forbesLnk(T('Forbes','Forbes'),'board-dock')+'</div><div style="display:flex;gap:10px"><button class="btn-s" onclick="E.swapStory()">'+T('換另一個 Story','Switch Story')+'</button><button class="btn-p" onclick="E.go(\'intro\')">'+T('返簡報','Back to present')+'</button></div></div></div>';
 return h;
}
const VIEWS={intro:V_intro,story:V_story,timeline:V_timeline,call:V_call,crowd:V_crowd,hints:V_hints,save:V_save,board:V_board};
function R(){
 applyTheme();document.documentElement.lang=L==='zh'?'zh-HK':'en';
 if(S.step==='crowd'||S.step==='hints'||S.step==='save'||S.step==='board'){if(!S.pick)S.step='call'}
 const fn=VIEWS[S.step]||V_intro;
 document.getElementById('app').innerHTML=fn()+(S.toast?'<div class="toast">'+S.toast+'</div>':'');
 if(S.toast){const t=S.toast;S.toast='';clearTimeout(window._tt);window._tt=setTimeout(()=>{const el=document.querySelector('.toast');el&&el.remove()},1800)}
 persist();syncURL();
 window.scrollTo(0,0);
}
window.E={
 lang(l){L=l;syncURL();R()},
 theme(t){TH=t;applyTheme();syncURL();R()},
 go(st){S.step=st;R()},
 story(id){if(S.sid!==id){S.sid=id;S.pick=null;S.at=null;S.saved=false;S.step=S.step==='intro'?'intro':'story'}else{S.sid=id}R()},
 call(p){if(S.pick)return;S.pick=p;S.at=hhmm();S.toast=T('已出 call · '+S.at,'Call made · '+S.at);S.step='crowd';R()},
 save(){S.saved=true;S.guest=false;S.toast=T('已保存','Saved');R()},
 dWhy(id){S.whyDismiss[id]=true;R()},
 dSpoon(id){S.spoonDismiss[id]=true;R()},
 toggleWhy(){S.whyOn=!S.whyOn;R()},
 toggleSpoon(){S.spoonOn=!S.spoonOn;R()},
 more(){setTimeout(()=>{const d=document.querySelector('details.more');S.moreOpen=!!(d&&d.open);persist()},0)},
 forbesHit(id){S.toast=T('去咗 Forbes · '+id,'Opened Forbes · '+id)},
 reset(){S=defaults();persist();R()}
};
/* deep-link helpers for screenshots */
const stepQ=(Q.match(/step=([a-z]+)/)||[])[1];
if(stepQ&&STEPS.includes(stepQ))S.step=stepQ;
if(/story=(mid|gta)/.test(Q))S.sid=Q.match(/story=(mid|gta)/)[1];
if(/pick=(y|n)/.test(Q)){S.pick=Q.match(/pick=(y|n)/)[1];S.at=S.at||'14:22'}
if(/why=0/.test(Q))S.whyOn=false;
R();
})();
</script></body></html>
