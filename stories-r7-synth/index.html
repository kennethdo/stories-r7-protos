<!doctype html>
<html lang="en" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forbes Predict · Stories</title>
<script>(function(){try{var p=new URLSearchParams(location.search);document.documentElement.setAttribute('data-theme',(p.get('theme')||'')==='dark'?'dark':'light');document.documentElement.lang=p.get('lang')==='zh'?'zh-HK':'en'}catch(e){}})()</script>
<style>
:root{--bg:#000;--ink:#ededed;--body:#a1a1a1;--mute:#888;--dim:#5c5c5c;--hair:#262626;--hs:#3d3d3d;--surface:#0a0a0a;--btn:#ededed;--btn-ink:#000;--track:#262626;--title:Graphik,'Helvetica Neue',Arial,sans-serif;--detail:Inter,system-ui,-apple-system,'PingFang HK','Noto Sans CJK TC',sans-serif}
[data-theme=light]{--bg:#fff;--ink:#111;--body:#4d4d4d;--mute:#6f6f6f;--dim:#9a9a9a;--hair:#e6e6e6;--hs:#d4d4d4;--surface:#fafafa;--btn:#111;--btn-ink:#fff;--track:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--detail);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
.app{max-width:390px;margin:0 auto;min-height:100vh;padding:0 20px 150px;overflow-x:hidden}
.top{display:flex;align-items:center;gap:10px;height:52px}
.top .t{flex:1;font-size:13px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:center}
.tag{font-size:11px;font-weight:500;color:var(--mute);border:1px solid var(--hs);border-radius:6px;padding:1px 6px}
.sw{font-size:12px;color:var(--mute);display:flex;gap:4px;align-items:center}.sw b{color:var(--ink);font-weight:600}
.sw button{position:relative;min-width:22px;min-height:32px;padding:0 3px}
.sw button::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.rail{display:flex;gap:4px;margin:4px 0 2px}.rail i{flex:1;height:3px;background:var(--hair);border-radius:2px}.rail i.on{background:var(--ink)}.rail i.done{background:var(--dim)}
.kick{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:18px}
.h1{font-family:var(--title);font-weight:600;letter-spacing:-.035em;font-size:28px;line-height:1.12;margin-top:8px}
.meta{font-size:13px;color:var(--mute)}
.fl{color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap}
.fl:hover{text-decoration:underline;text-decoration-color:var(--hs);text-underline-offset:3px}
.btn-p{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:9px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px}
.btn-s{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:9px;border:1px solid var(--hs);font-size:16px;font-weight:600}
.yn{display:flex;gap:10px;margin-top:22px}.yn>*{flex:1}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--hair);z-index:6}
.dock .in{max-width:390px;margin:0 auto;padding:12px 20px 20px}
.dock .cap{font-size:13px;color:var(--mute);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.spoon{position:relative;display:block;margin:0 auto 12px;max-width:300px;padding:7px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;text-align:center}
.spoon:after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.why{display:inline-block;margin-top:14px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border:1px dashed var(--hs);border-radius:6px;padding:3px 8px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--hs);border-radius:9px;padding:8px 14px;font-size:13px;z-index:12;white-space:nowrap}
.story-sw{display:flex;gap:8px;margin-top:12px}
.story-sw button{flex:1;border:1px solid var(--hs);border-radius:9px;padding:9px 10px;text-align:left;min-height:52px}
.story-sw button.on{border:2px solid var(--ink)}
.story-sw .n{display:block;font-size:14px;font-weight:600}.story-sw .u{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.big{font-family:var(--title);font-weight:600;letter-spacing:-.05em;font-size:64px;line-height:1;margin-top:26px}
.big small{font-size:18px;letter-spacing:-.01em;color:var(--mute);font-weight:500;margin-left:6px}
.split{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:14px}.split i{display:block;height:100%;background:var(--ink);transition:width .7s}
.srow{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--mute)}
.days{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;height:72px;border:1px solid var(--hs);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.day .d{font-size:11px;color:var(--dim)}.day .p{font-size:13px;font-weight:600;color:var(--ink)}
.day.miss .p{color:var(--dim);font-weight:400}.day.tod{border:2px solid var(--ink);width:66px;height:80px}.day.fut{border-style:dashed}.day.fut .p{color:var(--dim);font-weight:400}
.past{margin-top:14px}.past .r{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--hair);font-size:14px}
.past .r .d{width:46px;flex:none;font-size:12px;color:var(--dim);padding-top:2px}.past .r .q{flex:1;color:var(--body)}.past .r .s{font-size:12px;color:var(--mute);flex:none;padding-top:2px}
.qq{font-family:var(--title);font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.18;margin-top:10px}
.you{margin-top:16px;font-size:14px;color:var(--mute)}.you b{color:var(--ink)}
.hints{margin-top:16px}
.hint{display:block;padding:16px 0;border-top:1px solid var(--hair)}
.hint .k{font-size:12px;color:var(--mute)}.hint .q{font-family:var(--title);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:4px;color:var(--ink)}
.hint .go{display:inline-block;margin-top:8px;font-size:14px;font-weight:600;color:var(--ink)}
.board{margin-top:16px}
.board .row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--hair);font-size:15px}
.board .row .n{color:var(--dim);font-size:13px}.board .row .sc{font-family:var(--title);font-weight:600}
.board .row.me{font-weight:600;border-left:2px solid var(--ink);padding-left:10px;margin-left:-12px}
.more{margin-top:20px;border-top:1px solid var(--hair)}
.more summary{list-style:none;cursor:pointer;font-size:14px;color:var(--mute);min-height:48px;display:flex;align-items:center;justify-content:space-between}
.more summary::-webkit-details-marker{display:none}.more[open] summary{color:var(--ink)}
.more .m{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:14px;color:var(--body)}.more .m b{color:var(--ink);font-weight:500}
.saved{margin-top:26px;border-left:2px solid var(--ink);padding-left:14px}.saved b{display:block;font-size:16px}.saved span{font-size:14px;color:var(--mute)}
.pr{margin-top:14px;border:1px solid var(--hs);border-radius:12px;padding:16px}
.pr .row{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--hair);font-size:14px}.pr .row:first-child{border-top:0}
.pr .row span{color:var(--mute);font-size:12px;padding-top:2px}
.pfoot{margin-top:26px;font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
.pfoot button{color:var(--mute);font-size:12px;min-height:32px}
</style></head><body>

 '<div class="pr">'+[[T('共同把尺','Shared ruler'),T('註冊＋返 Forbes 讀文','Sign-ups and return reads on Forbes')],[T('建議','Recommend'),T('時間線＋領頭 market＋top callers','Timeline, one leading market, top callers')],[T('決定','Decision'),T('Jeff＋Chris 星期五前 yes／no','Jeff and Chris: yes or no by Friday')],[T('限制','Limits'),T('非體育 live、CVR 循環未解','Non-sports live and CVR loop still open')],[T('成熟度','Maturity'),T('可玩 · 未經用戶測試','Playable · not user-tested')]].map(r=>'<div class="row"><span>'+r[0]+'</span><div>'+r[1]+'</div></div>').join('')+'</div>'+pfoot()+
